name: Feature request / 功能建议
description: 提交能力或流程改进建议 / Propose a capability or improvement
title: "[Feature] "
labels: ["type: feature", "status: needs-review"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准 / Acceptance criteria
