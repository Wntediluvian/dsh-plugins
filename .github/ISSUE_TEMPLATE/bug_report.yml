name: Bug report / 缺陷报告
description: 报告一个可复现的问题 / Report a reproducible problem
title: "[Bug] "
labels: ["type: bug", "status: needs-review"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述 / Summary
      description: 说明期望行为与实际行为。 不要粘贴凭据、私钥或登录态。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected behavior
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 系统、版本、提交号（Commit SHA）。
